<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Poop Drop</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#120e0b}
canvas{display:block;width:100%;height:100%;touch-action:none}
#ver{position:fixed;right:10px;bottom:8px;color:#ffffff88;font:12px monospace;z-index:3}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ver">v-sausage-4</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W=0,H=0,floorY=0,DPR=Math.min(devicePixelRatio||1,2);
const rope=[],splashes=[];
const REST=24,RADIUS=46,MAX_POINTS=78,SPAWN_MS=58;
let lastSpawn=0,finishedAt=0;

const rand=(a,b)=>a+Math.random()*(b-a);
function nx(){return W*.5+Math.sin(performance.now()/1200)*Math.min(34,W*.04)}
function resize(){
  W=innerWidth;H=innerHeight;floorY=H-70;
  c.width=W*DPR;c.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(!rope.length) reset();
}
addEventListener('resize',resize);

function reset(){
  rope.length=0;
  const x=nx();
  rope.push({x,y:-8,px:x,py:-8,anchor:true});
  rope.push({x,y:REST-8,px:x,py:REST-8,anchor:false});
  lastSpawn=performance.now();finishedAt=0;
}
function addTail(){
  const t=rope[rope.length-1],p=rope[rope.length-2];
  let dx=t.x-p.x,dy=t.y-p.y,d=Math.hypot(dx,dy)||1;
  dx/=d;dy/=d;
  rope.push({x:t.x+dx*REST,y:t.y+dy*REST,px:t.x,py:t.y,anchor:false});
}
function splash(x,y,n=18){
  for(let i=0;i<n;i++){
    const a=rand(Math.PI*1.08,Math.PI*1.92),s=rand(2.5,7.2);
    splashes.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-rand(1,3),life:rand(24,48),r:rand(2,5)});
  }
}
function physics(now){
  rope[0].x=nx();rope[0].y=-8;rope[0].px=rope[0].x;rope[0].py=-8;

  if(rope.length<MAX_POINTS && now-lastSpawn>SPAWN_MS){
    addTail();lastSpawn=now;
    if(rope.length===MAX_POINTS) finishedAt=now;
  }

  for(let i=1;i<rope.length;i++){
    const p=rope[i],vx=(p.x-p.px)*.994,vy=(p.y-p.py)*.994;
    p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy+.52;
  }

  for(let iter=0;iter<14;iter++){
    rope[0].x=nx();rope[0].y=-8;
    for(let i=0;i<rope.length-1;i++){
      const a=rope[i],b=rope[i+1];
      let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.0001;
      const err=(d-REST)/d;
      if(i===0){b.x-=dx*err;b.y-=dy*err;}
      else{
        const ox=dx*err*.5,oy=dy*err*.5;
        a.x+=ox;a.y+=oy;b.x-=ox;b.y-=oy;
      }
    }
    for(let i=1;i<rope.length;i++){
      const p=rope[i];
      if(p.y+RADIUS>floorY){
        const impact=(p.py+RADIUS<floorY-2);
        p.y=floorY-RADIUS;
        const vx=p.x-p.px;
        p.px=p.x-vx*.72;
        p.py=p.y;
        if(impact && Math.random()<.18) splash(p.x,floorY,12);
      }
      if(p.x<RADIUS){p.x=RADIUS;p.px=p.x}
      if(p.x>W-RADIUS){p.x=W-RADIUS;p.px=p.x}
    }
  }

  for(let i=splashes.length-1;i>=0;i--){
    const s=splashes[i];s.vy+=.25;s.x+=s.vx;s.y+=s.vy;s.life--;
    if(s.y>floorY){s.y=floorY;s.vy*=-.15;s.vx*=.7}
    if(s.life<=0)splashes.splice(i,1);
  }
  if(finishedAt && now-finishedAt>6500) reset();
}

function path(points,ox=0,oy=0){
  if(points.length<2)return;
  ctx.beginPath();ctx.moveTo(points[0].x+ox,points[0].y+oy);
  for(let i=1;i<points.length-1;i++){
    const mx=(points[i].x+points[i+1].x)/2+ox,my=(points[i].y+points[i+1].y)/2+oy;
    ctx.quadraticCurveTo(points[i].x+ox,points[i].y+oy,mx,my);
  }
  const p=points[points.length-1];ctx.lineTo(p.x+ox,p.y+oy);
}
function draw(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#18110d');bg.addColorStop(1,'#090706');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#241b16';ctx.fillRect(0,floorY,W,H-floorY);
  ctx.fillStyle='#39281e';ctx.fillRect(0,floorY,W,5);

  ctx.fillStyle='#070504';ctx.beginPath();ctx.ellipse(nx(),-2,58,24,0,0,Math.PI*2);ctx.fill();

  ctx.lineCap='round';ctx.lineJoin='round';
  path(rope);ctx.strokeStyle='#32190d';ctx.lineWidth=112;ctx.stroke();
  path(rope);ctx.strokeStyle='#603116';ctx.lineWidth=98;ctx.stroke();
  path(rope);ctx.strokeStyle='#7b4421';ctx.lineWidth=72;ctx.stroke();
  path(rope,-12,-10);ctx.strokeStyle='rgba(191,121,66,.28)';ctx.lineWidth=18;ctx.stroke();

  for(const s of splashes){
    ctx.globalAlpha=Math.max(0,s.life/48);ctx.fillStyle='#d8b62d';
    ctx.beginPath();ctx.ellipse(s.x,s.y,s.r*1.8,s.r,.2,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function loop(t){physics(t);draw();requestAnimationFrame(loop)}
c.addEventListener('pointerdown',e=>{
  if(rope.some(p=>Math.hypot(e.clientX-p.x,e.clientY-p.y)<65)){
    splash(e.clientX,Math.min(e.clientY,floorY),30);reset();
  }
});
resize();requestAnimationFrame(loop);
</script>
</body>
</html>
