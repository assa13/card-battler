<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Poop Drop</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#15110d;font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;left:12px;top:10px;color:#f2e4c9aa;font-size:12px;user-select:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">tap the poop to clear it</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let W=0,H=0,DPR=Math.min(devicePixelRatio||1,2),floorY=0;
const chunks=[], splashes=[];
function resize(){
  W=innerWidth; H=innerHeight; floorY=H-70;
  c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';
  x.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);resize();

const rand=(a,b)=>a+Math.random()*(b-a);
let emitter={x:W*.5,y:-35,phase:0,acc:0,active:null};

function newChunk(){
  const segs=[];
  const n=18+Math.floor(Math.random()*8);
  for(let i=0;i<n;i++) segs.push({
    x:emitter.x+rand(-3,3), y:-35-i*5, px:emitter.x, py:-35-i*5,
    r:rand(30,42)
  });
  return {segs,rest:false,age:0};
}
function splash(px,py,amount=18){
  for(let i=0;i<amount;i++){
    const a=rand(-Math.PI*.95,-Math.PI*.05), s=rand(2.5,8);
    splashes.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:rand(2,6),life:rand(24,46)});
  }
}
function step(){
  emitter.x=W*.5+Math.sin(performance.now()/950)*W*.08;
  emitter.acc++;
  if(!emitter.active && emitter.acc>45){ emitter.acc=0; emitter.active=newChunk(); chunks.push(emitter.active); }
  const g=.42, damp=.992;
  for(const ch of chunks){
    ch.age++;
    const s=ch.segs;
    for(let i=0;i<s.length;i++){
      const p=s[i];
      const vx=(p.x-p.px)*damp, vy=(p.y-p.py)*damp;
      p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy+g;
      if(i===0 && ch===emitter.active && ch.age<150){
        p.x=emitter.x; p.y=Math.min(-10+ch.age*1.45,145);
      }
    }
    // constraints: makes one long soft "sausage"
    for(let k=0;k<5;k++){
      for(let i=1;i<s.length;i++){
        const a=s[i-1],b=s[i], dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,target=(a.r+b.r)*.66;
        const corr=(d-target)/d*.5;
        const cx=dx*corr,cy=dy*corr;
        if(!(i-1===0 && ch===emitter.active && ch.age<150)){a.x+=cx;a.y+=cy}
        b.x-=cx;b.y-=cy;
      }
      for(const p of s){
        if(p.y+p.r>floorY){
          const hit=(p.py+p.r<=floorY);
          p.y=floorY-p.r;
          p.py=p.y+(p.y-p.py)*.12;
          if(hit && Math.random()<.22) splash(p.x,floorY,12);
        }
        if(p.x-p.r<0)p.x=p.r;
        if(p.x+p.r>W)p.x=W-p.r;
      }
    }
    if(ch===emitter.active && ch.age>170) emitter.active=null;
  }
  for(let i=splashes.length-1;i>=0;i--){
    const p=splashes[i];p.vy+=.28;p.x+=p.vx;p.y+=p.vy;p.life--;
    if(p.y>floorY){p.y=floorY;p.vy*=-.18;p.vx*=.7}
    if(p.life<=0)splashes.splice(i,1);
  }
}
function draw(){
  x.clearRect(0,0,W,H);
  const bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#17120e');bg.addColorStop(1,'#0d0b09');x.fillStyle=bg;x.fillRect(0,0,W,H);
  x.fillStyle='#28201a';x.fillRect(0,floorY,W,H-floorY);
  x.fillStyle='#35291f';x.fillRect(0,floorY,W,5);

  for(const ch of chunks){
    const s=ch.segs;
    x.lineCap='round';x.lineJoin='round';
    for(let i=1;i<s.length;i++){
      const a=s[i-1],b=s[i];
      x.strokeStyle='#5a3218';x.lineWidth=(a.r+b.r)*1.62;
      x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();
      x.strokeStyle='#7a4725';x.lineWidth=(a.r+b.r)*1.08;
      x.beginPath();x.moveTo(a.x-2,a.y-3);x.lineTo(b.x-2,b.y-3);x.stroke();
    }
    for(const p of s){
      const grd=x.createRadialGradient(p.x-6,p.y-8,2,p.x,p.y,p.r*1.3);
      grd.addColorStop(0,'#9b6132');grd.addColorStop(.45,'#6f3f20');grd.addColorStop(1,'#3f2415');
      x.fillStyle=grd;x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fill();
    }
  }
  for(const p of splashes){
    x.globalAlpha=Math.max(0,p.life/46);
    x.fillStyle='#d7b527';
    x.beginPath();x.ellipse(p.x,p.y,p.r*1.7,p.r,.3,0,Math.PI*2);x.fill();
  }
  x.globalAlpha=1;
}
function loop(){step();draw();requestAnimationFrame(loop)}loop();

function hit(px,py){
  for(let i=chunks.length-1;i>=0;i--){
    if(chunks[i].segs.some(p=>Math.hypot(px-p.x,py-p.y)<p.r*1.5)){
      splash(px,Math.min(py,floorY),26);
      if(chunks[i]===emitter.active) emitter.active=null;
      chunks.splice(i,1);return;
    }
  }
}
c.addEventListener('pointerdown',e=>hit(e.clientX,e.clientY));
</script>
</body>
</html>
