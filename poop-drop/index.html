<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Poop Drop</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#120d0a}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #ver{position:fixed;right:10px;bottom:8px;color:#ffffff88;font:12px monospace;z-index:2;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ver">v-refactor-1</div>
<script>
'use strict';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha:false });

const CFG = Object.freeze({
  segment: 22,
  radius: 46,
  maxNodes: 92,
  emitEvery: 72,
  gravity: 0.58,
  damping: 0.992,
  constraintIterations: 12,
  selfCollisionIterations: 2,
  selfDistance: 78,
  selfSkip: 4,
  floorMargin: 72,
  wallMargin: 50,
  resetDelay: 7000
});

let W=0,H=0,DPR=1,floorY=0;
let lastTime=0,lastEmit=0,finishedAt=0;
let phase=Math.random()*Math.PI*2;
const nodes=[];
const splashes=[];

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);

function nozzleX(t){
  const amp=Math.min(44,W*0.045);
  return W*0.5 + Math.sin(t*0.0007 + phase)*amp;
}

function resize(){
  W=innerWidth;
  H=innerHeight;
  DPR=Math.min(devicePixelRatio||1,2);
  floorY=H-CFG.floorMargin;
  canvas.width=Math.round(W*DPR);
  canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(!nodes.length) reset(performance.now());
}

addEventListener('resize',resize);

function makeNode(x,y,vx=0,vy=0){
  return {x,y,px:x-vx,py:y-vy};
}

function reset(now){
  nodes.length=0;
  splashes.length=0;
  phase=Math.random()*Math.PI*2;
  const x=nozzleX(now);
  nodes.push(makeNode(x,-CFG.segment)); // hidden anchor
  nodes.push(makeNode(x,2,0,2.0));      // visible tip
  lastEmit=now;
  finishedAt=0;
}

function emit(now){
  if(nodes.length>=CFG.maxNodes){
    if(!finishedAt) finishedAt=now;
    return;
  }

  const x=nozzleX(now);
  const oldFirst=nodes[1];
  const dx=oldFirst ? oldFirst.x-x : 0;

  // New material appears at the nozzle. Existing material is pushed down.
  nodes.splice(1,0,makeNode(
    x+clamp(dx*0.12,-4,4),
    1,
    clamp(dx*0.02,-0.6,0.6),
    2.4
  ));
}

function integrate(){
  for(let i=1;i<nodes.length;i++){
    const p=nodes[i];
    const vx=(p.x-p.px)*CFG.damping;
    const vy=(p.y-p.py)*CFG.damping;
    p.px=p.x;
    p.py=p.y;
    p.x+=vx;
    p.y+=vy+CFG.gravity;
  }
}

function pinAnchor(now){
  const x=nozzleX(now);
  const a=nodes[0];
  a.x=x;
  a.y=-CFG.segment;
  a.px=x;
  a.py=-CFG.segment;
}

function solveDistance(){
  for(let i=0;i<nodes.length-1;i++){
    const a=nodes[i], b=nodes[i+1];
    let dx=b.x-a.x, dy=b.y-a.y;
    let d=Math.hypot(dx,dy);
    if(d<0.0001){ dx=0;dy=1;d=1; }
    const error=(d-CFG.segment)/d;

    if(i===0){
      b.x-=dx*error;
      b.y-=dy*error;
    }else{
      const ox=dx*error*0.5;
      const oy=dy*error*0.5;
      a.x+=ox; a.y+=oy;
      b.x-=ox; b.y-=oy;
    }
  }
}

function solveBounds(){
  for(let i=1;i<nodes.length;i++){
    const p=nodes[i];

    if(p.y+CFG.radius>floorY){
      const impactVy=p.y-p.py;
      const firstImpact=p.py+CFG.radius<floorY-3;
      p.y=floorY-CFG.radius;
      p.py=p.y+Math.min(0,impactVy*0.08);

      const vx=p.x-p.px;
      p.px=p.x-vx*0.78;

      if(firstImpact && impactVy>2.2 && Math.random()<0.22){
        splash(p.x,floorY,10);
      }
    }

    const minX=CFG.wallMargin;
    const maxX=W-CFG.wallMargin;
    if(p.x<minX){
      p.x=minX;
      p.px=p.x+(p.x-p.px)*0.15;
    }else if(p.x>maxX){
      p.x=maxX;
      p.px=p.x+(p.x-p.px)*0.15;
    }
  }
}

function solveSelfCollision(){
  const minD=CFG.selfDistance;
  const minD2=minD*minD;

  for(let i=1;i<nodes.length;i++){
    for(let j=i+CFG.selfSkip+1;j<nodes.length;j++){
      const a=nodes[i],b=nodes[j];
      let dx=b.x-a.x,dy=b.y-a.y;
      let d2=dx*dx+dy*dy;
      if(d2>=minD2) continue;

      if(d2<0.0001){
        dx=(Math.random()-0.5)*0.01;
        dy=0.01;
        d2=dx*dx+dy*dy;
      }

      const d=Math.sqrt(d2);
      const push=(minD-d)/d*0.5;
      const ox=dx*push,oy=dy*push;

      a.x-=ox; a.y-=oy;
      b.x+=ox; b.y+=oy;
    }
  }
}

function splash(x,y,count){
  for(let i=0;i<count;i++){
    const angle=rnd(Math.PI*1.10,Math.PI*1.90);
    const speed=rnd(2.2,7.0);
    splashes.push({
      x,y,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed-rnd(0.5,2.2),
      life:rnd(26,54),
      size:rnd(2.0,5.2)
    });
  }
}

function updateSplashes(){
  for(let i=splashes.length-1;i>=0;i--){
    const s=splashes[i];
    s.vy+=0.24;
    s.x+=s.vx;
    s.y+=s.vy;
    s.life-=1;
    if(s.y>floorY){
      s.y=floorY;
      s.vy*=-0.12;
      s.vx*=0.68;
    }
    if(s.life<=0) splashes.splice(i,1);
  }
}

function simulate(now){
  pinAnchor(now);

  while(nodes.length<CFG.maxNodes && now-lastEmit>=CFG.emitEvery){
    lastEmit+=CFG.emitEvery;
    emit(now);
  }

  integrate();

  for(let iter=0;iter<CFG.constraintIterations;iter++){
    pinAnchor(now);
    solveDistance();
    solveBounds();
  }

  for(let iter=0;iter<CFG.selfCollisionIterations;iter++){
    solveSelfCollision();
    for(let k=0;k<3;k++){
      pinAnchor(now);
      solveDistance();
      solveBounds();
    }
  }

  updateSplashes();

  if(nodes.length>=CFG.maxNodes && !finishedAt) finishedAt=now;
  if(finishedAt && now-finishedAt>CFG.resetDelay) reset(now);
}

function smoothPath(points,offsetX=0,offsetY=0){
  if(points.length<2) return;
  ctx.beginPath();
  ctx.moveTo(points[0].x+offsetX,points[0].y+offsetY);
  for(let i=1;i<points.length-1;i++){
    const p=points[i],n=points[i+1];
    const mx=(p.x+n.x)*0.5+offsetX;
    const my=(p.y+n.y)*0.5+offsetY;
    ctx.quadraticCurveTo(p.x+offsetX,p.y+offsetY,mx,my);
  }
  const last=points[points.length-1];
  ctx.lineTo(last.x+offsetX,last.y+offsetY);
}

function drawBackground(now){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1b120d');
  bg.addColorStop(0.7,'#0d0907');
  bg.addColorStop(1,'#080605');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#211812';
  ctx.fillRect(0,floorY,W,H-floorY);
  ctx.fillStyle='#3a281d';
  ctx.fillRect(0,floorY,W,5);

  const x=nozzleX(now);
  ctx.fillStyle='#070504';
  ctx.beginPath();
  ctx.ellipse(x,-1,68,27,0,0,Math.PI*2);
  ctx.fill();
}

function drawBody(){
  if(nodes.length<2) return;

  ctx.lineCap='round';
  ctx.lineJoin='round';

  smoothPath(nodes);
  ctx.strokeStyle='#2c140b';
  ctx.lineWidth=118;
  ctx.stroke();

  smoothPath(nodes);
  ctx.strokeStyle='#5a2b13';
  ctx.lineWidth=102;
  ctx.stroke();

  smoothPath(nodes);
  ctx.strokeStyle='#7b431f';
  ctx.lineWidth=76;
  ctx.stroke();

  smoothPath(nodes,-11,-10);
  ctx.strokeStyle='rgba(214,145,82,.24)';
  ctx.lineWidth=18;
  ctx.stroke();

  // Hide the anchor section above the nozzle so the mass looks extruded.
  ctx.fillStyle='#070504';
  ctx.fillRect(0,-80,W,42);
}

function drawSplashes(){
  for(const s of splashes){
    ctx.globalAlpha=clamp(s.life/54,0,1);
    ctx.fillStyle='#d4b52e';
    ctx.beginPath();
    ctx.ellipse(s.x,s.y,s.size*1.7,s.size,0.18,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;
}

function render(now){
  drawBackground(now);
  drawBody();
  drawSplashes();
}

function frame(now){
  if(!lastTime) lastTime=now;
  lastTime=now;
  simulate(now);
  render(now);
  requestAnimationFrame(frame);
}

canvas.addEventListener('pointerdown',e=>{
  let hit=false;
  for(let i=1;i<nodes.length;i++){
    if(Math.hypot(e.clientX-nodes[i].x,e.clientY-nodes[i].y)<CFG.radius+18){
      hit=true; break;
    }
  }
  if(hit){
    splash(e.clientX,Math.min(e.clientY,floorY),28);
    reset(performance.now());
  }
});

resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
