<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Poop Drop</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#15110d;font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;left:12px;top:10px;color:#f2e4c9aa;font-size:12px;user-select:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">tap the poop to clear it</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let W=0,H=0,DPR=Math.min(devicePixelRatio||1,2),floorY=0;
const splashes=[];
function resize(){
  W=innerWidth; H=innerHeight; floorY=H-70;
  c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';
  x.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);resize();

const rand=(a,b)=>a+Math.random()*(b-a);
let emitter={x:W*.5};
const rope=[];
let spawnTick=0;

function addSegment(){
  const prev=rope[rope.length-1];
  const y=prev ? prev.y-28 : -40;
  rope.push({x:emitter.x+rand(-2,2),y,px:emitter.x,py:y,r:34});
}
function splash(px,py,amount=18){
  for(let i=0;i<amount;i++){
    const a=rand(-Math.PI*.95,-Math.PI*.05), s=rand(2.5,8);
    splashes.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:rand(2,6),life:rand(24,46)});
  }
}
function step(){
  emitter.x=W*.5+Math.sin(performance.now()/1100)*W*.045;
  spawnTick++;
  if(spawnTick>5 && rope.length<34){spawnTick=0;addSegment();}
  const g=.38,damp=.995;

  for(let i=0;i<rope.length;i++){
    const p=rope[i];
    const vx=(p.x-p.px)*damp, vy=(p.y-p.py)*damp;
    p.px=p.x;p.py=p.y;
    p.x+=vx;p.y+=vy+g;
    if(i===0 && rope.length<34){
      p.x=emitter.x;
      p.y=Math.min(130, p.y+1.15);
    }
  }

  for(let k=0;k<8;k++){
    for(let i=1;i<rope.length;i++){
      const a=rope[i-1],b=rope[i];
      const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;
      const target=48;
      const diff=(d-target)/d;
      const cx=dx*diff*.5,cy=dy*diff*.5;
      if(i-1!==0 || rope.length>=34){a.x+=cx;a.y+=cy;}
      b.x-=cx;b.y-=cy;
    }
    for(const p of rope){
      if(p.y+p.r>floorY){
        const hit=(p.py+p.r<=floorY);
        p.y=floorY-p.r;
        p.px=p.x-(p.x-p.px)*.35;
        p.py=p.y+(p.y-p.py)*.2;
        if(hit && Math.random()<.28)splash(p.x,floorY,14);
      }
      if(p.x-p.r<0)p.x=p.r;
      if(p.x+p.r>W)p.x=W-p.r;
    }
  }

  for(let i=splashes.length-1;i>=0;i--){
    const p=splashes[i];p.vy+=.28;p.x+=p.vx;p.y+=p.vy;p.life--;
    if(p.y>floorY){p.y=floorY;p.vy*=-.18;p.vx*=.7}
    if(p.life<=0)splashes.splice(i,1);
  }
}
function draw(){
  x.clearRect(0,0,W,H);
  const bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#17120e');bg.addColorStop(1,'#0d0b09');x.fillStyle=bg;x.fillRect(0,0,W,H);
  x.fillStyle='#28201a';x.fillRect(0,floorY,W,H-floorY);
  x.fillStyle='#35291f';x.fillRect(0,floorY,W,5);

  if(rope.length){
    x.lineCap='round';x.lineJoin='round';
    x.strokeStyle='#4a2815';
    x.lineWidth=74;
    x.beginPath();
    x.moveTo(rope[0].x,rope[0].y);
    for(let i=1;i<rope.length;i++)x.lineTo(rope[i].x,rope[i].y);
    x.stroke();

    x.strokeStyle='#754321';
    x.lineWidth=58;
    x.beginPath();
    x.moveTo(rope[0].x-3,rope[0].y-4);
    for(let i=1;i<rope.length;i++)x.lineTo(rope[i].x-3,rope[i].y-4);
    x.stroke();

    for(const p of rope){
      const grd=x.createRadialGradient(p.x-10,p.y-12,3,p.x,p.y,p.r*1.25);
      grd.addColorStop(0,'#a66a39');
      grd.addColorStop(.45,'#6f3d1f');
      grd.addColorStop(1,'#3c2113');
      x.fillStyle=grd;
      x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fill();
    }
  }
  for(const p of splashes){
    x.globalAlpha=Math.max(0,p.life/46);
    x.fillStyle='#d7b527';
    x.beginPath();x.ellipse(p.x,p.y,p.r*1.7,p.r,.3,0,Math.PI*2);x.fill();
  }
  x.globalAlpha=1;
}
function loop(){step();draw();requestAnimationFrame(loop)}loop();

function hit(px,py){
  if(rope.some(p=>Math.hypot(px-p.x,py-p.y)<p.r*1.6)){
    splash(px,Math.min(py,floorY),28);
    rope.length=0;
    spawnTick=0;
  }
}
c.addEventListener('pointerdown',e=>hit(e.clientX,e.clientY));
</script>
<div id="ver" style="position:fixed;right:10px;bottom:8px;color:#ffffff88;font:12px monospace;z-index:10">v1ef6c50</div></body>
</html>
