<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Poop Blocks</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#17120f;font-family:Arial,sans-serif}
    body{touch-action:none;user-select:none}
    #game{display:block;width:100vw;height:100vh;background:#1a1715}
    #hud{position:fixed;left:18px;top:16px;color:#fff;font-weight:700;font-size:20px;text-shadow:0 2px 4px #000;z-index:2}
    #hint{position:fixed;left:50%;top:18px;transform:translateX(-50%);color:#f4d0aa;font-size:15px;opacity:.92;z-index:2;text-align:center}
    #floor{position:fixed;left:0;right:0;bottom:0;height:9vh;background:#2a2420;border-top:2px solid #4a403a;pointer-events:none}
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">Убрано блоков: <span id="score">0</span></div>
  <div id="hint">Какашки падают сверху на пол. Нажми на блок — он исчезнет.</div>
  <div id="floor"></div>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score');
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
let score=0,last=performance.now(),spawnAcc=0,nextId=1;
const clusters=[];
const rand=(a,b)=>a+Math.random()*(b-a);
const floorY=()=>H-H*.09;

function resize(){
  W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
  canvas.width=W*DPR;canvas.height=H*DPR;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);resize();

function makeCluster(){
  const count=Math.floor(rand(5,8));
  const r=rand(18,26), spacing=r*1.55;
  const cx=rand(90,Math.max(110,W-90));
  const nodes=[];
  for(let i=0;i<count;i++){
    const row=Math.floor(i/3), col=i%3;
    nodes.push({
      x:cx+(col-1)*spacing+rand(-5,5),
      y:-120-row*spacing+rand(-4,4),
      vx:rand(-30,30),vy:rand(-10,25),
      r, hue:rand(22,31), squash:1
    });
  }
  const links=[];
  for(let i=1;i<nodes.length;i++){
    const parent=Math.max(0,i-1-(i%3===0?2:0));
    links.push({a:parent,b:i,len:spacing*.96});
  }
  if(nodes.length>4) links.push({a:1,b:4,len:spacing*.96});
  if(nodes.length>5) links.push({a:2,b:5,len:spacing*.96});
  clusters.push({id:nextId++,nodes,links});
  if(clusters.length>10) clusters.shift();
}

function solveLink(a,b,len){
  const dx=b.x-a.x,dy=b.y-a.y;
  const d=Math.hypot(dx,dy)||.001;
  const diff=(d-len)/d;
  const k=.46;
  const ox=dx*diff*k*.5, oy=dy*diff*k*.5;
  a.x+=ox;a.y+=oy;b.x-=ox;b.y-=oy;
  const rvx=b.vx-a.vx,rvy=b.vy-a.vy;
  const nx=dx/d,ny=dy/d;
  const rel=rvx*nx+rvy*ny;
  const damp=rel*.08;
  a.vx+=nx*damp;a.vy+=ny*damp;
  b.vx-=nx*damp;b.vy-=ny*damp;
}

function collide(a,b){
  const dx=b.x-a.x,dy=b.y-a.y;
  const min=a.r+b.r, d2=dx*dx+dy*dy;
  if(d2<=0||d2>=min*min)return;
  const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,over=min-d;
  a.x-=nx*over*.5;a.y-=ny*over*.5;
  b.x+=nx*over*.5;b.y+=ny*over*.5;
  const rvx=b.vx-a.vx,rvy=b.vy-a.vy;
  const sep=rvx*nx+rvy*ny;
  if(sep<0){
    const imp=-sep*.42;
    a.vx-=nx*imp;a.vy-=ny*imp;
    b.vx+=nx*imp;b.vy+=ny*imp;
  }
}

function update(dt){
  spawnAcc+=dt;
  if(spawnAcc>1.65){spawnAcc=0;makeCluster();}
  const fy=floorY();
  const all=[];
  for(const c of clusters){
    for(const n of c.nodes){
      n.vy+=1100*dt;
      n.vx*=.999;n.vy*=.999;
      n.x+=n.vx*dt;n.y+=n.vy*dt;
      if(n.x-n.r<0){n.x=n.r;n.vx=Math.abs(n.vx)*.35}
      if(n.x+n.r>W){n.x=W-n.r;n.vx=-Math.abs(n.vx)*.35}
      if(n.y+n.r>fy){
        n.y=fy-n.r;
        if(n.vy>0)n.vy*=-.16;
        n.vx*=.82;
        n.squash=.78;
      }
      n.squash+=(1-n.squash)*Math.min(1,dt*10);
      all.push(n);
    }
  }
  for(let s=0;s<5;s++){
    for(const c of clusters) for(const l of c.links) solveLink(c.nodes[l.a],c.nodes[l.b],l.len);
    for(let i=0;i<all.length;i++) for(let j=i+1;j<all.length;j++) collide(all[i],all[j]);
    for(const n of all){
      if(n.y+n.r>fy){n.y=fy-n.r;if(n.vy>0)n.vy=0}
    }
  }
}

function drawNode(n){
  ctx.save();
  ctx.translate(n.x,n.y);ctx.scale(1,n.squash);

  ctx.shadowColor='rgba(0,0,0,.5)';
  ctx.shadowBlur=12;
  ctx.shadowOffsetY=7;

  const dark='hsl('+n.hue+',62%,18%)';
  const mid='hsl('+n.hue+',58%,28%)';
  const light='hsl('+n.hue+',54%,38%)';

  // bottom coil
  let g=ctx.createRadialGradient(-n.r*.3,-n.r*.15,n.r*.08,0,0,n.r*1.15);
  g.addColorStop(0,light);g.addColorStop(.5,mid);g.addColorStop(1,dark);
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.ellipse(0,n.r*.34,n.r*.88,n.r*.47,0,0,Math.PI*2);
  ctx.fill();

  // middle coil
  g=ctx.createRadialGradient(-n.r*.22,-n.r*.32,n.r*.06,0,-n.r*.18,n.r*.9);
  g.addColorStop(0,light);g.addColorStop(.52,mid);g.addColorStop(1,dark);
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.ellipse(0,-n.r*.08,n.r*.68,n.r*.42,-.05,0,Math.PI*2);
  ctx.fill();

  // upper coil
  ctx.beginPath();
  ctx.ellipse(n.r*.05,-n.r*.43,n.r*.46,n.r*.32,.08,0,Math.PI*2);
  ctx.fill();

  // curved tip
  ctx.beginPath();
  ctx.moveTo(n.r*.02,-n.r*.6);
  ctx.bezierCurveTo(n.r*.18,-n.r*.82,n.r*.05,-n.r*.98,-n.r*.08,-n.r*.96);
  ctx.bezierCurveTo(-n.r*.22,-n.r*.95,-n.r*.27,-n.r*.8,-n.r*.16,-n.r*.72);
  ctx.bezierCurveTo(-n.r*.08,-n.r*.66,-n.r*.02,-n.r*.63,n.r*.02,-n.r*.6);
  ctx.closePath();
  ctx.fill();

  ctx.shadowColor='transparent';

  // glossy wet highlights so it reads instantly as poop
  ctx.fillStyle='rgba(255,239,205,.16)';
  ctx.beginPath();
  ctx.ellipse(-n.r*.24,n.r*.18,n.r*.16,n.r*.08,-.25,0,Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(-n.r*.12,-n.r*.28,n.r*.1,n.r*.055,-.45,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle='rgba(44,20,9,.35)';
  ctx.lineWidth=Math.max(2,n.r*.07);
  ctx.beginPath();
  ctx.arc(0,n.r*.24,n.r*.48,.15*Math.PI,.9*Math.PI);
  ctx.stroke();

  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const fy=floorY();
  ctx.fillStyle='rgba(0,0,0,.16)';ctx.fillRect(0,fy,W,H-fy);
  for(const c of clusters){
    ctx.save();
    ctx.lineWidth=8;ctx.lineCap='round';ctx.strokeStyle='rgba(83,45,23,.9)';
    for(const l of c.links){
      const a=c.nodes[l.a],b=c.nodes[l.b];
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    }
    ctx.restore();
    for(const n of c.nodes) drawNode(n);
  }
}

function hit(x,y){
  for(let ci=clusters.length-1;ci>=0;ci--){
    const c=clusters[ci];
    for(const n of c.nodes){
      const dx=x-n.x,dy=y-n.y;
      if(dx*dx+dy*dy<(n.r*1.2)*(n.r*1.2)){
        clusters.splice(ci,1);
        score++;scoreEl.textContent=score;
        return;
      }
    }
  }
}
canvas.addEventListener('pointerdown',e=>{
  const r=canvas.getBoundingClientRect();
  hit(e.clientX-r.left,e.clientY-r.top);
});

function loop(now){
  const dt=Math.min(.025,(now-last)/1000);last=now;
  update(dt);draw();requestAnimationFrame(loop);
}
makeCluster();makeCluster();
requestAnimationFrame(loop);
</script>
</body>
</html>
